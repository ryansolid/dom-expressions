packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  nx: true
  simple-git-hooks: true
linkWorkspacePackages: true
# The compiler platform binary packages don't exist on the registry until
# the binaries workflow publishes them; link them to their in-repo sources so
# installs resolve deterministically.
overrides:
  '@dom-expressions/compiler-darwin-x64': 'link:packages/compiler/npm/darwin-x64'
  '@dom-expressions/compiler-darwin-arm64': 'link:packages/compiler/npm/darwin-arm64'
  '@dom-expressions/compiler-linux-x64-gnu': 'link:packages/compiler/npm/linux-x64-gnu'
  '@dom-expressions/compiler-linux-arm64-gnu': 'link:packages/compiler/npm/linux-arm64-gnu'
  '@dom-expressions/compiler-win32-x64-msvc': 'link:packages/compiler/npm/win32-x64-msvc'
  '@dom-expressions/compiler-wasm32-wasi': 'link:packages/compiler/npm/wasm32-wasi'
